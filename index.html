<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pragun Anand - Portfolio</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@300;700;900&display=swap" rel="stylesheet">
<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
<link rel="stylesheet" href="style.css" />
* {margin:0; padding:0; box-sizing:border-box;}
body, html {height:100%; font-family:'Source Sans Pro', sans-serif;}

/* Hero Section */
.hero {
    position: relative;
    width: 100%;
    height: 100vh;
    background: url('your-image-file.png') no-repeat center center/cover; /* Replace with your image file name */
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    color: #fff;
}

.hero::after {
    content:'';
    position:absolute; top:0; left:0; width:100%; height:100%;
    background: rgba(0,0,0,0.4); /* Dark overlay for contrast */
}

.hero-content {position:relative; z-index:1;}
.hero h1 {
    font-size:4rem; font-weight:900; margin-bottom:0.5rem;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
}
.hero p {
    font-size:1.5rem; margin-bottom:2rem; opacity:0.9;
    text-shadow: 1px 1px 6px rgba(0,0,0,0.7);
}

/* Social Icons */
.social-icons {display:flex; gap:1rem; justify-content:center; flex-wrap:wrap;}
.social-icons a {
    display:flex; align-items:center; justify-content:center;
    width:60px; height:60px; border:2px solid #fff; border-radius:50%;
    color:#fff; font-size:1.5rem; transition:all 0.3s ease;
    background: rgba(255,255,255,0.1);
}
.social-icons a:hover {
    background-color: #0077b6;
    color:#fff;
    transform: scale(1.2);
    box-shadow: 0 0 15px #0077b6;
}

/* Footer */
footer {
    position:absolute; bottom:20px; width:100%;
    text-align:center; color:#fff; opacity:0.8;
    font-weight: 500;
}

/* Responsive */
@media(max-width:768px){
    .hero h1 {font-size:3rem;}
    .hero p {font-size:1.2rem;}
    .social-icons a {width:50px; height:50px; font-size:1.2rem;}
}
</style>
</head>
<body>
<!-- Hero Section -->
<section class="hero">
    <div class="hero-content">

            <a href="mailto:pragunanand1893@gmail.com"><i class="fas fa-envelope"></i></a>
        </div>
    </div>
    <footer>© Pragun Anand.</footer>
</section>
</body>
</html>
